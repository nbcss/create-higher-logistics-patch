pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Matches the repository/directory name. The published artifact is still `higherlogisticspatch` (base.archivesName in
// build.gradle), which is the coordinate Create: Factory Controller bundles.
rootProject.name = 'create_higher_logistics_patch'
